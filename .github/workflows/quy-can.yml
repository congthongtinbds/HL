name: Cap nhat quy can tu dong
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quy-can
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5 cryptography==43.0.3
      - name: Doc bang hang cac san
        env:
          SOURCES: ${{ secrets.SOURCES }}
          APP_KEY: ${{ secrets.APP_KEY }}
          OUT: feed
        run: python tools/feed.py
      - name: Luu quy can moi
        run: |
          git config user.name "quy-can-tu-dong"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then echo "Khong co thay doi"; else git commit -m "Cap nhat quy can $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')" && git push; fi
