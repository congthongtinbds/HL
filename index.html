<script>
var P = {
  "1": "https://script.google.com/macros/s/AKfycbywAdmP2T72-qYtLfUoaBnQpxfNhr_r3zxNEzh-pcIkuDU9xPyjyP09KwkP_ILUR3ufkA/exec",
  "2": "https://script.google.com/macros/s/AKfycbwEgmv4gliQyFWw9vm-h2f9AjxB0kQJGGAQuC4JfkXrY_YG3L0Y7gcAUebNk_Dr7oo/exec"
};

var fr = document.getElementById("app");

function getTargetUrl() {
  var h = (location.hash || "").replace(/^#\/?/, ""), m = h.match(/^([12])(?:\/([\w-]*))?$/);
  if (!m) return P["2"] + "?page=app";
  return P[m[1]] + (m[2] ? "?page=" + encodeURIComponent(m[2]) : "");
}

function open_(url) { 
  fr.src = url; 
}

fr.addEventListener("load", function () { 
  document.getElementById("wait").style.display = "none"; 
});

window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.khung !== "go" || typeof d.url !== "string") return;
  open_(d.url);
});

// ⭐ BỔ SUNG: Tự động dọn sạch đuôi # trên URL ngay lập tức khi nó bị gán vào
setInterval(function() {
  if (location.hash) {
    history.replaceState(null, "", location.pathname + location.search);
  }
}, 300);

// Khởi chạy ứng dụng
open_(getTargetUrl());
</script>
